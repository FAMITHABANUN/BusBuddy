<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusBuddy - Student Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7ff;
            color: #222;
        }

        /* NAVBAR */

        nav {
            height: 70px;
            background: linear-gradient(135deg, #24104f, #4b1f87);
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #c8a6ff;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .role-badge {
            background: rgba(255,255,255,0.15);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .logout-btn {
            border: none;
            background: white;
            color: #421875;
            padding: 9px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* HERO */

        .hero {
            background: linear-gradient(135deg, #35156b, #6833a8);
            color: white;

            padding: 45px 6%;

            border-radius: 0 0 30px 30px;
        }

        .hero h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 16px;
            opacity: 0.9;
        }

        /* MAIN */

        .container {
            width: 88%;
            max-width: 1200px;
            margin: 35px auto;
        }

        /* STAT CARDS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
            color: #4b1f87;
        }

        /* REPORT BUTTON */

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-section h2 {
            color: #35156b;
        }

        .report-btn {
            background: linear-gradient(135deg, #542399, #7c42c2);
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        /* FILTER */

        .filter-section {
            background: white;
            padding: 18px;
            border-radius: 16px;
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .filter-section input,
        .filter-section select {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
        }

        /* ISSUES */

        .issues-container {
            display: grid;
            gap: 20px;
        }

        .issue-card {
            background: white;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .issue-title {
            font-size: 19px;
            font-weight: bold;
            color: #35156b;
        }

        .issue-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 12px 0;
            color: #555;
            font-size: 14px;
        }

        .issue-description {
            background: #f7f4ff;
            padding: 12px;
            border-radius: 10px;
            margin: 12px 0;
            color: #444;
        }

        /* BADGES */

        .badge {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .reported {
            background: #fff3cd;
            color: #856404;
        }

        .progress {
            background: #cfe2ff;
            color: #084298;
        }

        .resolved {
            background: #d1e7dd;
            color: #0f5132;
        }

        /* STATUS TRACKER */

        .tracker {
            display: flex;
            align-items: center;
            margin-top: 22px;
        }

        .step {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #ddd;
            color: #777;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: auto;

            font-weight: bold;

            position: relative;
            z-index: 2;
        }

        .step.active .circle {
            background: #5b2695;
            color: white;
        }

        .step.completed .circle {
            background: #198754;
            color: white;
        }

        .step p {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .line {
            position: absolute;
            top: 17px;
            left: 50%;
            width: 100%;
            height: 3px;
            background: #ddd;
            z-index: 1;
        }

        .step:last-child .line {
            display: none;
        }

        .step.completed .line {
            background: #198754;
        }

        /* EMPTY */

        .empty {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 18px;
            color: #777;
        }

        /* MODAL */

        .modal {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.55);

            align-items: center;
            justify-content: center;

            z-index: 1000;
        }

        .modal-box {
            background: white;

            width: 90%;
            max-width: 520px;

            padding: 30px;

            border-radius: 20px;
        }

        .modal-box h2 {
            color: #35156b;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #6b35aa;
        }

        .form-group input.error,
        .form-group select.error,
        .form-group textarea.error {
            border: 2px solid #dc3545;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .field-error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .form-message {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-btn,
        .submit-btn {
            padding: 11px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel-btn {
            background: #eee;
            border: none;
        }

        .submit-btn {
            background: #542399;
            color: white;
            border: none;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .filter-section {
                flex-direction: column;
            }

            .top-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

            nav {
                padding: 0 4%;
            }

            .user-section {
                gap: 8px;
            }

            .role-badge {
                display: none;
            }

            .hero h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav>

    <div class="logo">
        🚌 Bus<span>Buddy</span>
    </div>

    <div class="user-section">

        <span id="usernameDisplay"></span>

        <span class="role-badge">
            STUDENT
        </span>

        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>

</nav>


<!-- HERO -->

<section class="hero">

    <h1>
        Welcome, <span id="heroUsername"></span> 👋
    </h1>

    <p>
        Track your transport complaints and stay updated on their progress.
    </p>

</section>


<!-- MAIN -->

<div class="container">


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">

            <h3>
                My Issues
            </h3>

            <p id="totalIssues">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>
                Reported
            </h3>

            <p id="reportedIssues">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>
                In Progress
            </h3>

            <p id="progressIssues">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>
                Resolved
            </h3>

            <p id="resolvedIssues">
                0
            </p>

        </div>

    </div>


    <!-- TITLE -->

    <div class="top-section">

        <h2>
            My Transport Issues
        </h2>

        <button
            class="report-btn"
            onclick="openModal()">

            + Report New Issue

        </button>

    </div>


    <!-- SEARCH AND FILTER -->

    <div class="filter-section">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 Search my issues..."
            oninput="displayIssues()"
        >


        <select
            id="statusFilter"
            onchange="displayIssues()">

            <option value="All">
                All Status
            </option>

            <option value="Reported">
                Reported
            </option>

            <option value="In Progress">
                In Progress
            </option>

            <option value="Resolved">
                Resolved
            </option>

        </select>

    </div>


    <!-- ISSUES -->

    <div
        id="issuesContainer"
        class="issues-container">

    </div>

</div>


<!-- REPORT MODAL -->

<div
    id="reportModal"
    class="modal">


    <div class="modal-box">


        <h2>
            🚌 Report Transport Issue
        </h2>


        <form id="issueForm">


            <!-- BUS NUMBER -->

            <div class="form-group">

                <label>
                    Bus Number *
                </label>

                <input
                    type="text"
                    id="busNumber"
                    placeholder="Example: 9"
                    maxlength="20"
                >

                <div
                    id="busNumberError"
                    class="field-error">
                </div>

            </div>


            <!-- ROUTE -->

            <div class="form-group">

                <label>
                    Route *
                </label>

                <input
                    type="text"
                    id="route"
                    placeholder="Example: VPM Bypass"
                    maxlength="100"
                >

                <div
                    id="routeError"
                    class="field-error">
                </div>

            </div>


            <!-- ISSUE TYPE -->

            <div class="form-group">

                <label>
                    Issue Type *
                </label>

                <select id="issueType">

                    <option value="">
                        Select Issue Type
                    </option>

                    <option value="Bus Delay">
                        Bus Delay
                    </option>

                    <option value="Overcrowding">
                        Overcrowding
                    </option>

                    <option value="Damaged Seat">
                        Damaged Seat
                    </option>

                    <option value="Route Problem">
                        Route Problem
                    </option>

                    <option value="Maintenance">
                        Maintenance
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

                <div
                    id="issueTypeError"
                    class="field-error">
                </div>

            </div>


            <!-- PRIORITY -->

            <div class="form-group">

                <label>
                    Priority *
                </label>

                <select id="priority">

                    <option value="Low">
                        Low
                    </option>

                    <option value="Medium" selected>
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description *
                </label>

                <textarea
                    id="description"
                    placeholder="Describe the transport issue..."
                    maxlength="500">
                </textarea>

                <div
                    id="descriptionError"
                    class="field-error">
                </div>

            </div>


            <div
                id="formMessage"
                class="form-message">
            </div>


            <!-- BUTTONS -->

            <div class="modal-buttons">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()">

                    Cancel

                </button>


                <button
                    type="submit"
                    class="submit-btn"
                    id="submitButton">

                    Submit Issue

                </button>

            </div>


        </form>

    </div>

</div>


<script>


const API_URL =
    "http://127.0.0.1:8000/api/issues/";


const username =
    localStorage.getItem("busbuddy_username");


const role =
    localStorage.getItem("busbuddy_role");


// LOGIN PROTECTION

if (!username || role !== "student") {

    window.location.href =
        "login.html";

}


// DISPLAY USERNAME

document.getElementById(
    "usernameDisplay"
).textContent = username;


document.getElementById(
    "heroUsername"
).textContent = username;


// STORE ISSUES

let allIssues = [];


// LOAD ISSUES

async function loadIssues() {

    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Failed to load issues"
            );

        }


        allIssues =
            await response.json();


        displayIssues();

        updateStats();


    } catch (error) {

        console.error(error);


        document.getElementById(
            "issuesContainer"
        ).innerHTML = `

            <div class="empty">

                <h3>
                    Unable to load issues
                </h3>

                <p>
                    Please make sure the Django server is running.
                </p>

            </div>

        `;

    }

}


// GET MY ISSUES

function getMyIssues() {

    return allIssues.filter(
        issue =>
            issue.reported_by === username
    );

}


// DISPLAY ISSUES

function displayIssues() {

    const container =
        document.getElementById(
            "issuesContainer"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value.toLowerCase();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    let issues =
        getMyIssues();


    // SEARCH

    issues =
        issues.filter(issue => {

            const text = `

                ${issue.bus_number}
                ${issue.route}
                ${issue.issue_type}
                ${issue.description}
                ${issue.status}

            `.toLowerCase();


            return text.includes(search);

        });


    // STATUS FILTER

    if (status !== "All") {

        issues =
            issues.filter(
                issue =>
                    issue.status === status
            );

    }


    // EMPTY RESULT

    if (issues.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    📭 No issues found
                </h3>

                <p>
                    Your reported transport issues will appear here.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        issues.map(
            issue =>
                createIssueCard(issue)
        ).join("");

}


// CREATE ISSUE CARD

function createIssueCard(issue) {


    let badgeClass =
        "reported";


    if (
        issue.status === "In Progress"
    ) {

        badgeClass =
            "progress";

    }


    if (
        issue.status === "Resolved"
    ) {

        badgeClass =
            "resolved";

    }


    return `

        <div class="issue-card">


            <div class="issue-header">

                <div class="issue-title">

                    🚌 Bus ${issue.bus_number}
                    —
                    ${issue.issue_type}

                </div>


                <span class="badge ${badgeClass}">

                    ${issue.status}

                </span>

            </div>


            <div class="issue-info">

                <div>
                    <strong>Route:</strong>
                    ${issue.route}
                </div>

                <div>
                    <strong>Priority:</strong>
                    ${issue.priority}
                </div>

                <div>
                    <strong>Reported By:</strong>
                    ${issue.reported_by}
                </div>

                <div>
                    <strong>Issue ID:</strong>
                    #${issue.id}
                </div>

            </div>


            <div class="issue-description">

                <strong>
                    Description:
                </strong>

                <br>

                ${issue.description}

            </div>


            ${createTracker(issue.status)}

        </div>

    `;

}


// STATUS TRACKER

function createTracker(status) {


    let reportedClass =
        "active";

    let progressClass =
        "";

    let resolvedClass =
        "";


    if (
        status === "In Progress"
    ) {

        reportedClass =
            "completed";

        progressClass =
            "active";

    }


    if (
        status === "Resolved"
    ) {

        reportedClass =
            "completed";

        progressClass =
            "completed";

        resolvedClass =
            "active";

    }


    return `

        <div class="tracker">


            <div class="step ${reportedClass}">

                <div class="circle">
                    ✓
                </div>

                <p>
                    Reported
                </p>

                <div class="line"></div>

            </div>


            <div class="step ${progressClass}">

                <div class="circle">

                    ${
                        status === "In Progress" ||
                        status === "Resolved"
                        ? "✓"
                        : "2"
                    }

                </div>

                <p>
                    In Progress
                </p>

                <div class="line"></div>

            </div>


            <div class="step ${resolvedClass}">

                <div class="circle">

                    ${
                        status === "Resolved"
                        ? "✓"
                        : "3"
                    }

                </div>

                <p>
                    Resolved
                </p>

            </div>


        </div>

    `;

}


// UPDATE STATS

function updateStats() {


    const issues =
        getMyIssues();


    const reported =
        issues.filter(
            issue =>
                issue.status === "Reported"
        ).length;


    const progress =
        issues.filter(
            issue =>
                issue.status === "In Progress"
        ).length;


    const resolved =
        issues.filter(
            issue =>
                issue.status === "Resolved"
        ).length;


    document.getElementById(
        "totalIssues"
    ).textContent =
        issues.length;


    document.getElementById(
        "reportedIssues"
    ).textContent =
        reported;


    document.getElementById(
        "progressIssues"
    ).textContent =
        progress;


    document.getElementById(
        "resolvedIssues"
    ).textContent =
        resolved;

}


// CLEAR VALIDATION ERRORS

function clearValidation() {


    const fields = [

        "busNumber",
        "route",
        "issueType",
        "description"

    ];


    fields.forEach(id => {

        document.getElementById(id)
            .classList.remove("error");

    });


    const errors = [

        "busNumberError",
        "routeError",
        "issueTypeError",
        "descriptionError"

    ];


    errors.forEach(id => {

        const element =
            document.getElementById(id);

        element.textContent = "";

        element.style.display = "none";

    });


    document.getElementById(
        "formMessage"
    ).textContent = "";

}


// SHOW FIELD ERROR

function showError(
    fieldId,
    errorId,
    message
) {


    document.getElementById(fieldId)
        .classList.add("error");


    const errorElement =
        document.getElementById(errorId);


    errorElement.textContent =
        message;


    errorElement.style.display =
        "block";

}


// VALIDATE FORM

function validateForm() {


    clearValidation();


    let isValid = true;


    const busNumber =
        document.getElementById(
            "busNumber"
        ).value.trim();


    const route =
        document.getElementById(
            "route"
        ).value.trim();


    const issueType =
        document.getElementById(
            "issueType"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    // BUS NUMBER

    if (!busNumber) {

        showError(
            "busNumber",
            "busNumberError",
            "Bus number is required."
        );

        isValid = false;

    } else if (busNumber.length > 20) {

        showError(
            "busNumber",
            "busNumberError",
            "Bus number is too long."
        );

        isValid = false;

    } else if (!/^[A-Za-z0-9 -]+$/.test(busNumber)) {

        showError(
            "busNumber",
            "busNumberError",
            "Use only letters, numbers, spaces or hyphens."
        );

        isValid = false;

    }


    // ROUTE

    if (!route) {

        showError(
            "route",
            "routeError",
            "Route is required."
        );

        isValid = false;

    } else if (route.length < 2) {

        showError(
            "route",
            "routeError",
            "Route must contain at least 2 characters."
        );

        isValid = false;

    }


    // ISSUE TYPE

    if (!issueType) {

        showError(
            "issueType",
            "issueTypeError",
            "Please select an issue type."
        );

        isValid = false;

    }


    // DESCRIPTION

    if (!description) {

        showError(
            "description",
            "descriptionError",
            "Description is required."
        );

        isValid = false;

    } else if (description.length < 10) {

        showError(
            "description",
            "descriptionError",
            "Please provide at least 10 characters."
        );

        isValid = false;

    } else if (description.length > 500) {

        showError(
            "description",
            "descriptionError",
            "Description cannot exceed 500 characters."
        );

        isValid = false;

    }


    return isValid;

}


// OPEN MODAL

function openModal() {

    document.getElementById(
        "reportModal"
    ).style.display =
        "flex";


    clearValidation();

}


// CLOSE MODAL

function closeModal() {

    document.getElementById(
        "reportModal"
    ).style.display =
        "none";


    document.getElementById(
        "issueForm"
    ).reset();


    clearValidation();

}


// SUBMIT ISSUE

document.getElementById(
    "issueForm"
).addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        // VALIDATE FIRST

        if (!validateForm()) {

            document.getElementById(
                "formMessage"
            ).style.color =
                "#dc3545";


            document.getElementById(
                "formMessage"
            ).textContent =
                "Please correct the highlighted fields.";


            return;

        }


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        submitButton.disabled =
            true;


        submitButton.textContent =
            "Submitting...";


        const issueData = {


            bus_number:

                document.getElementById(
                    "busNumber"
                ).value.trim(),


            route:

                document.getElementById(
                    "route"
                ).value.trim(),


            issue_type:

                document.getElementById(
                    "issueType"
                ).value,


            description:

                document.getElementById(
                    "description"
                ).value.trim(),


            reported_by:

                username,


            status:

                "Reported",


            priority:

                document.getElementById(
                    "priority"
                ).value

        };


        try {


            const response =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                issueData
                            )

                    }
                );


            if (!response.ok) {

                const errorData =
                    await response.json()
                    .catch(() => null);


                console.error(
                    "Server error:",
                    errorData
                );


                throw new Error(
                    "Failed to submit issue"
                );

            }


            document.getElementById(
                "formMessage"
            ).style.color =
                "green";


            document.getElementById(
                "formMessage"
            ).textContent =
                "✅ Issue reported successfully!";


            setTimeout(
                () => {

                    closeModal();

                    loadIssues();

                },
                800
            );


        } catch (error) {


            console.error(error);


            document.getElementById(
                "formMessage"
            ).style.color =
                "#dc3545";


            document.getElementById(
                "formMessage"
            ).textContent =
                "❌ Failed to report issue. Please try again.";


            submitButton.disabled =
                false;


            submitButton.textContent =
                "Submit Issue";

        }

    }
);


// LOGOUT

function logout() {


    localStorage.removeItem(
        "busbuddy_username"
    );


    localStorage.removeItem(
        "busbuddy_role"
    );


    window.location.href =
        "login.html";

}


// INITIAL LOAD

loadIssues();


</script>
