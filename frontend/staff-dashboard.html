<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusBuddy - Admin Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7ff;
            color: #222;
        }

        /* NAVBAR */

        nav {
            height: 70px;
            background: linear-gradient(135deg, #1d123d, #482078);
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #c9a8ff;
        }

        .admin-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .username {
            font-size: 14px;
        }

        .admin-badge {
            background: rgba(255,255,255,0.15);
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .logout-btn {
            border: none;
            background: white;
            color: #421875;
            padding: 9px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* HERO */

        .hero {
            background: linear-gradient(135deg, #35156b, #6833a8);
            color: white;

            padding: 45px 6%;

            border-radius: 0 0 30px 30px;
        }

        .hero h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .hero p {
            opacity: 0.9;
        }

        /* CONTAINER */

        .container {
            width: 88%;
            max-width: 1250px;
            margin: 35px auto;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;

            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 24px;

            border-radius: 18px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.07);

            border-left: 5px solid #542399;
        }

        .stat-card h3 {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card p {
            color: #421875;
            font-size: 30px;
            font-weight: bold;
        }

        /* SECTION HEADER */

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .section-header h2 {
            color: #35156b;
        }

        .refresh-btn {
            background: #542399;
            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 20px;

            cursor: pointer;
            font-weight: bold;
        }

        /* FILTER */

        .filter-box {
            background: white;

            padding: 18px;

            border-radius: 16px;

            display: grid;
            grid-template-columns: 2fr 1fr 1fr;

            gap: 15px;

            margin-bottom: 25px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .filter-box input,
        .filter-box select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 14px;
        }

        .filter-box input:focus,
        .filter-box select:focus {

            border-color: #6b35aa;

        }

        /* ISSUE CARD */

        .issues-container {

            display: grid;

            gap: 20px;

        }

        .issue-card {

            background: white;

            padding: 24px;

            border-radius: 18px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.07);

            transition: 0.2s;

        }

        .issue-card:hover {

            transform: translateY(-2px);

            box-shadow: 0 8px 25px rgba(0,0,0,0.10);

        }

        .issue-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

        }

        .issue-title {

            font-size: 19px;

            font-weight: bold;

            color: #35156b;

        }

        .badges {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

        }

        .badge {

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: bold;

        }

        /* STATUS */

        .reported {

            background: #fff3cd;

            color: #856404;

        }

        .progress {

            background: #cfe2ff;

            color: #084298;

        }

        .resolved {

            background: #d1e7dd;

            color: #0f5132;

        }

        /* PRIORITY */

        .low {

            background: #e7f1ff;

            color: #245a9a;

        }

        .medium {

            background: #fff0d5;

            color: #925b00;

        }

        .high {

            background: #f8d7da;

            color: #842029;

        }

        /* INFO */

        .issue-info {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 15px;

            font-size: 14px;

            color: #555;

        }

        .info-item {

            background: #f8f7fc;

            padding: 10px;

            border-radius: 9px;

        }

        .info-item strong {

            display: block;

            color: #35156b;

            margin-bottom: 4px;

            font-size: 12px;

        }

        .description {

            background: #f7f4ff;

            padding: 13px;

            border-radius: 10px;

            color: #444;

            margin-bottom: 18px;

        }

        /* ACTIONS */

        .actions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }

        .action-btn {

            border: none;

            padding: 10px 16px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: bold;

            font-size: 13px;

        }

        .edit-btn {

            background: #e9ddff;

            color: #542399;

        }

        .resolve-btn {

            background: #d1e7dd;

            color: #0f5132;

        }

        .delete-btn {

            background: #f8d7da;

            color: #842029;

        }

        /* EMPTY */

        .empty {

            background: white;

            padding: 50px;

            text-align: center;

            border-radius: 18px;

            color: #777;

        }

        .empty h3 {

            margin-bottom: 8px;

            color: #542399;

        }

        /* MODAL */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.55);

            align-items: center;

            justify-content: center;

            z-index: 1000;

            padding: 20px;

        }

        .modal-box {

            background: white;

            width: 100%;

            max-width: 520px;

            padding: 30px;

            border-radius: 20px;

        }

        .modal-box h2 {

            color: #35156b;

            margin-bottom: 22px;

        }

        .form-group {

            margin-bottom: 17px;

        }

        .form-group label {

            display: block;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;

        }

        .form-group select,

        .form-group textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

        }

        textarea {

            min-height: 110px;

            resize: vertical;

        }

        .modal-buttons {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;

        }

        .cancel-btn,

        .save-btn {

            border: none;

            padding: 11px 20px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: bold;

        }

        .cancel-btn {

            background: #eee;

        }

        .save-btn {

            background: #542399;

            color: white;

        }

        .message {

            text-align: center;

            margin-top: 10px;

            font-size: 14px;

        }

        /* RESPONSIVE */

        @media (max-width: 900px) {

            .stats {

                grid-template-columns: repeat(2, 1fr);

            }

            .filter-box {

                grid-template-columns: 1fr;

            }

            .issue-info {

                grid-template-columns: 1fr 1fr;

            }

        }

        @media (max-width: 600px) {

            .stats {

                grid-template-columns: 1fr;

            }

            .issue-info {

                grid-template-columns: 1fr;

            }

            .admin-badge,

            .username {

                display: none;

            }

            .hero h1 {

                font-size: 27px;

            }

            .issue-top {

                flex-direction: column;

                align-items: flex-start;

                gap: 12px;

            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav>

    <div class="logo">
        🚌 Bus<span>Buddy</span>
    </div>

    <div class="admin-section">

        <span class="username" id="usernameDisplay"></span>

        <span class="admin-badge">
            ADMIN / STAFF
        </span>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </div>

</nav>


<!-- HERO -->

<section class="hero">

    <h1>
        Transport Management Dashboard 🚌
    </h1>

    <p>
        Monitor student complaints, manage transport issues,
        and keep the college transportation system running smoothly.
    </p>

</section>


<!-- MAIN -->

<div class="container">


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">

            <h3>Total Issues</h3>

            <p id="totalIssues">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>Reported</h3>

            <p id="reportedIssues">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>In Progress</h3>

            <p id="progressIssues">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>Resolved</h3>

            <p id="resolvedIssues">
                0
            </p>

        </div>

    </div>


    <!-- HEADER -->

    <div class="section-header">

        <h2>
            Transport Issues
        </h2>

        <button
            class="refresh-btn"
            onclick="loadIssues()">
            🔄 Refresh
        </button>

    </div>


    <!-- FILTER -->

    <div class="filter-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 Search bus, route, issue or student..."
            oninput="displayIssues()"
        >


        <select
            id="statusFilter"
            onchange="displayIssues()">

            <option value="All">
                All Status
            </option>

            <option value="Reported">
                Reported
            </option>

            <option value="In Progress">
                In Progress
            </option>

            <option value="Resolved">
                Resolved
            </option>

        </select>


        <select
            id="priorityFilter"
            onchange="displayIssues()">

            <option value="All">
                All Priority
            </option>

            <option value="Low">
                Low
            </option>

            <option value="Medium">
                Medium
            </option>

            <option value="High">
                High
            </option>

        </select>

    </div>


    <!-- ISSUES -->

    <div
        id="issuesContainer"
        class="issues-container">

    </div>

</div>


<!-- EDIT MODAL -->

<div
    id="editModal"
    class="modal">

    <div class="modal-box">

        <h2>
            ✏️ Update Transport Issue
        </h2>


        <div class="form-group">

            <label>
                Status
            </label>

            <select id="editStatus">

                <option value="Reported">
                    Reported
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Resolved">
                    Resolved
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Priority
            </label>

            <select id="editPriority">

                <option value="Low">
                    Low
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="High">
                    High
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                id="editDescription">
            </textarea>

        </div>


        <div
            id="editMessage"
            class="message">
        </div>


        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closeEditModal()">

                Cancel

            </button>


            <button
                class="save-btn"
                onclick="saveIssue()">

                Save Changes

            </button>

        </div>

    </div>

</div>


<script>


const API_URL =
    "https://busbuddy-prmi.onrender.com/api/issues/";


const username =
    localStorage.getItem("busbuddy_username");


const role =
    localStorage.getItem("busbuddy_role");


// SECURITY CHECK

if (
    !username ||
    (role !== "admin" && role !== "staff")
) {

    window.location.href =
        "login.html";

}


// DISPLAY USER

document.getElementById(
    "usernameDisplay"
).textContent = username;


// STORE ISSUES

let allIssues = [];

let editingIssueId = null;


// LOAD ISSUES

async function loadIssues() {

    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Failed to load issues"
            );

        }


        allIssues =
            await response.json();


        displayIssues();

        updateStats();


    } catch (error) {

        console.error(error);


        document.getElementById(
            "issuesContainer"
        ).innerHTML = `

            <div class="empty">

                <h3>
                    ⚠️ Unable to load issues
                </h3>

                <p>
                    Please make sure the Django server is running.
                </p>

            </div>

        `;

    }

}


// DISPLAY ISSUES

function displayIssues() {

    const container =
        document.getElementById(
            "issuesContainer"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value.toLowerCase();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const priority =
        document.getElementById(
            "priorityFilter"
        ).value;


    let issues =
        [...allIssues];


    // SEARCH

    issues =
        issues.filter(issue => {

            const text = `

                ${issue.id}
                ${issue.bus_number}
                ${issue.route}
                ${issue.issue_type}
                ${issue.description}
                ${issue.reported_by}
                ${issue.status}
                ${issue.priority}

            `.toLowerCase();


            return text.includes(search);

        });


    // STATUS FILTER

    if (status !== "All") {

        issues =
            issues.filter(
                issue =>
                    issue.status === status
            );

    }


    // PRIORITY FILTER

    if (priority !== "All") {

        issues =
            issues.filter(
                issue =>
                    issue.priority === priority
            );

    }


    if (issues.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    📭 No issues found
                </h3>

                <p>
                    No transport complaints match your filters.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        issues.map(
            issue =>
                createIssueCard(issue)
        ).join("");

}


// CREATE ISSUE CARD

function createIssueCard(issue) {


    let statusClass =
        "reported";


    if (
        issue.status === "In Progress"
    ) {

        statusClass =
            "progress";

    }


    if (
        issue.status === "Resolved"
    ) {

        statusClass =
            "resolved";

    }


    let priorityClass =
        "medium";


    if (
        issue.priority === "Low"
    ) {

        priorityClass =
            "low";

    }


    if (
        issue.priority === "High"
    ) {

        priorityClass =
            "high";

    }


    let resolveButton = "";


    if (
        issue.status !== "Resolved"
    ) {

        resolveButton = `

            <button
                class="action-btn resolve-btn"
                onclick="quickResolve(${issue.id})">

                ✓ Mark Resolved

            </button>

        `;

    }


    return `

        <div class="issue-card">

            <div class="issue-top">

                <div class="issue-title">

                    🚌 Bus ${issue.bus_number}
                    —
                    ${issue.issue_type}

                </div>


                <div class="badges">

                    <span
                        class="badge ${statusClass}">

                        ${issue.status}

                    </span>


                    <span
                        class="badge ${priorityClass}">

                        ${issue.priority} Priority

                    </span>

                </div>

            </div>


            <div class="issue-info">


                <div class="info-item">

                    <strong>
                        ISSUE ID
                    </strong>

                    #${issue.id}

                </div>


                <div class="info-item">

                    <strong>
                        ROUTE
                    </strong>

                    ${issue.route}

                </div>


                <div class="info-item">

                    <strong>
                        REPORTED BY
                    </strong>

                    ${issue.reported_by}

                </div>


            </div>


            <div class="description">

                <strong>
                    Description:
                </strong>

                <br><br>

                ${issue.description}

            </div>


            <div class="actions">

                ${resolveButton}


                <button
                    class="action-btn edit-btn"
                    onclick="openEditModal(${issue.id})">

                    ✏️ Edit

                </button>


                <button
                    class="action-btn delete-btn"
                    onclick="deleteIssue(${issue.id})">

                    🗑️ Delete

                </button>

            </div>


        </div>

    `;

}


// UPDATE STATISTICS

function updateStats() {


    const total =
        allIssues.length;


    const reported =
        allIssues.filter(
            issue =>
                issue.status === "Reported"
        ).length;


    const progress =
        allIssues.filter(
            issue =>
                issue.status === "In Progress"
        ).length;


    const resolved =
        allIssues.filter(
            issue =>
                issue.status === "Resolved"
        ).length;


    document.getElementById(
        "totalIssues"
    ).textContent = total;


    document.getElementById(
        "reportedIssues"
    ).textContent = reported;


    document.getElementById(
        "progressIssues"
    ).textContent = progress;


    document.getElementById(
        "resolvedIssues"
    ).textContent = resolved;

}


// QUICK RESOLVE

async function quickResolve(id) {


    const confirmed =
        confirm(
            "Are you sure you want to mark this issue as Resolved?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}${id}/`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status: "Resolved"
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to resolve issue"
            );

        }


        await loadIssues();


    } catch (error) {

        console.error(error);

        alert(
            "Unable to update the issue."
        );

    }

}


// OPEN EDIT MODAL

function openEditModal(id) {


    const issue =
        allIssues.find(
            item => item.id === id
        );


    if (!issue) {
        return;
    }


    editingIssueId =
        id;


    document.getElementById(
        "editStatus"
    ).value =
        issue.status;


    document.getElementById(
        "editPriority"
    ).value =
        issue.priority;


    document.getElementById(
        "editDescription"
    ).value =
        issue.description;


    document.getElementById(
        "editMessage"
    ).textContent = "";


    document.getElementById(
        "editModal"
    ).style.display =
        "flex";

}


// CLOSE MODAL

function closeEditModal() {

    document.getElementById(
        "editModal"
    ).style.display =
        "none";

    editingIssueId =
        null;

}


// SAVE ISSUE

async function saveIssue() {


    if (!editingIssueId) {
        return;
    }


    const status =
        document.getElementById(
            "editStatus"
        ).value;


    const priority =
        document.getElementById(
            "editPriority"
        ).value;


    const description =
        document.getElementById(
            "editDescription"
        ).value.trim();


    const message =
        document.getElementById(
            "editMessage"
        );


    if (!description) {

        message.style.color =
            "red";

        message.textContent =
            "Description cannot be empty.";

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}${editingIssueId}/`,
                {

                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        status:
                            status,

                        priority:
                            priority,

                        description:
                            description

                    })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to update issue"
            );

        }


        message.style.color =
            "green";

        message.textContent =
            "Issue updated successfully!";


        setTimeout(
            async () => {

                closeEditModal();

                await loadIssues();

            },
            600
        );


    } catch (error) {

        console.error(error);


        message.style.color =
            "red";

        message.textContent =
            "Failed to update issue.";

    }

}


// DELETE ISSUE

async function deleteIssue(id) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this issue?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}${id}/`,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to delete issue"
            );

        }


        await loadIssues();


    } catch (error) {

        console.error(error);

        alert(
            "Unable to delete the issue."
        );

    }

}


// LOGOUT

function logout() {


    localStorage.removeItem(
        "busbuddy_username"
    );


    localStorage.removeItem(
        "busbuddy_role"
    );


    window.location.href =
        "login.html";

}


// INITIAL LOAD

loadIssues();


</script>

</body>

</html>
